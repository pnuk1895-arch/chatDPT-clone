<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChatGPT Clone</title>
    <link rel="stylesheet" href="/homePage.css">
</head>

<body>

    <div class="container">

        <!-- ===== SIDEBAR ===== -->
        <aside class="sidebar" id="sidebar" role="navigation" aria-label="Chat history">

            <div class="sidebar-header">

                <!-- close button (mobile only) -->
                <button class="closeSidebar" id="closeSidebar" aria-label="Close sidebar">
                    ✕
                </button>

                <!-- New Chat -->
                <button class="new-chat-btn" id="new-chat-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
                    </svg>
                    New Chat
                </button>

                <!-- static suggestions -->
                <div class="chat-list">
                    <div class="chat-item"><span class="icon">📘</span> HTML Basics</div>
                    <div class="chat-item"><span class="icon">🎨</span> CSS Flexbox</div>
                    <div class="chat-item"><span class="icon">⚡</span> JavaScript DOM</div>
                    <div class="chat-item"><span class="icon">⚛️</span> React Interview</div>
                </div>

                <!-- history -->
                <div class="historyBox" id="historyBox">
                                       
                </div>
            </div>
        </aside>

        <!-- ===== BACKDROP (mobile) ===== -->
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <!-- ===== MAIN CONTENT ===== -->
        <main class="main" id="mainContent">

            <div class="chat-container">

                <!-- Top Bar (mobile) -->
                <div class="top-bar" id="topBar">
                    <button class="openSidebar" id="openSidebar" aria-label="Open sidebar">
                        ☰
                    </button>
                    <span class="chat-title" id="chatTitle">ChatGPT</span>
                </div>

                <!-- Messages -->

                <!-- Welcome Screen -->
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="sub-icon">✨</div>
                    <h1>ChatGPT Clone</h1>
                    <p>How can I help you today?</p>
                </div>

                <div class="messages" id="messages">

                    <!-- messages will be injected here -->
                </div>

                <!-- Input Area -->
                <div class="input-wrapper">
                    <div class="input-area">
                        <input id="message-input" type="text" placeholder="Message ChatGPT…" autocomplete="off" />
                        <button id="send-btn" aria-label="Send message">
                            ➤
                        </button>
                    </div>
                </div>

            </div>
        </main>

    </div>
    <script src="/homePage.js"></script>
</body>
</html>
