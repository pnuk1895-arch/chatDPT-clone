<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Clone</title>
    <link rel="stylesheet" href="/homePage.css">
</head>
<body>

    <div class="container">
    
        <!-- Sidebar -->
        <div class="sidebar">


            <div class="closeSlidebar">
                ☰
            </div>
            <div class="sidebar-header" id="chat-list">
                
                <button class="new-chat-btn" id="new-chat-btn">
                    + New Chat
                </button>
                
                <div class="chat-list">
                    <div class="chat-item">📘 HTML Basics</div>
                    <div class="chat-item">🎨 CSS Flexbox</div>
                    <div class="chat-item">⚡ JavaScript DOM</div>
                    <div class="chat-item">⚛️ React Interview</div>
                </div>
                <div class="historyBox">
                    <!-- dynamic history items would go here -->
                    <div class="chatHistoryBox">Welcome to ChatGPT</div>
                    <div class="chatHistoryBox">What is AI?</div>
                    <div class="chatHistoryBox">CSS tips</div>
                </div>
            </div>
        </div>

        <!-- Main -->
        <div class="main">

            <div class="chat-container">
                
                <div class="openSlidebar">
                    ☰
                </div>

                <div class="welcome-screen" id="welcome-screen">
                    <h1>ChatGPT Clone</h1>
                    <p>How can I help you today?</p>
                </div>

                <div class="messages" id="messages">
                    <!-- messages appear here dynamically -->
                </div>

                <div class="input-area">
                    <input
                    id="message-input"
                    type="text"
                    placeholder="Message ChatGPT…"
                    />
                    <button id="send-btn" aria-label="Send message">
                        ➤
                    </button>
                </div>

            </div>

        </div>

    </div>

    <!-- (no extra JS – kept exactly as originally linked) -->
    <script src="/homePage.js"></script>

</body>
</html>
